<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ 一個月快樂 ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft JhengHei",sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    overflow:hidden;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#ffd1ff);
}

.container{
    text-align:center;
    color:white;
    z-index:2;
    padding:30px;
}

h1{
    font-size:48px;
    margin-bottom:20px;
    animation:fadeIn 2s;
}

p{
    font-size:24px;
    line-height:1.8;
    opacity:0;
    animation:fadeIn 2s forwards;
    animation-delay:1s;
}

button{
    margin-top:30px;
    padding:15px 35px;
    font-size:20px;
    border:none;
    border-radius:50px;
    background:white;
    color:#ff4f81;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.1);
}

.heart{
    position:absolute;
    color:#ff3366;
    animation:float 6s linear infinite;
    user-select:none;
}

@keyframes float{
    from{
        transform:translateY(100vh) scale(.5);
        opacity:1;
    }
    to{
        transform:translateY(-120vh) scale(1.5);
        opacity:0;
    }
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>

</head>

<body>

<div class="container">
    <h1>💖 一個月快樂 💖</h1>

    <p id="text">
        一個月快樂，我愛你 廖尹瑄 ❤️<br><br>
        —— 王耀勝 敬上
    </p>

    <button onclick="showLove()">點我 ❤️</button>
</div>

<script>
function showLove(){
    alert("❤️ 一個月快樂！希望我們能一起走過更多個一個月 ❤️");
}

function createHeart(){
    const heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤";

    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(20+Math.random()*30)+"px";
    heart.style.animationDuration=(3+Math.random()*3)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },6000);
}

setInterval(createHeart,250);
</script>

</body>
</html>
