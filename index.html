<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一個月快樂 ❤️</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #ffd6e7, #ffeef5);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: "Microsoft JhengHei", sans-serif;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            max-width: 700px;
            text-align: center;
        }

        h1 {
            color: #ff4d88;
        }

        p {
            font-size: 22px;
            line-height: 1.8;
            color: #444;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>❤️ 一個月快樂 ❤️</h1>

    <p>
        最可愛的廖尹瑄<br><br>

        我知道我有時候很白癡，<br>
        但還是很謝謝你跟我渡過我們的第一個月。<br><br>

        我愛你 廖尹瑄 🤓<br><br>

        一個月快樂 💕💕<br><br>

        —— 王耀勝 🐢 敬上
    </p>
</div>

</body>
</html>
